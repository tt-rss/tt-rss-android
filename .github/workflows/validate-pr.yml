name: Validate PR

on:
  pull_request:
    branches: [master]
    paths-ignore:
    - 'utils/**'
    - '.*'
    - '*.md'


permissions:
  contents: read


concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true


jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: 21
        distribution: temurin

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

    - name: Install Android 37 platform
      shell: bash
      run: |
        test -n "${ANDROID_SDK_ROOT:-}"
        yes | sdkmanager --licenses > /dev/null
        sdkmanager "platforms;android-37" "build-tools;37.0.0"
        test -d "$ANDROID_SDK_ROOT/platforms/android-37"
        java -version
        sdkmanager --list_installed

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Run checks and build debug APK
      run: ./gradlew --no-daemon check assembleDebug

    - name: Generate lint summary
      if: always()
      run: bash .github/scripts/generate-lint-summary.sh
